<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>WorkTime ERP</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{--bg:#f5f6fa;--card:#fff;--tx:#1b1f2a;--mu:#6b7285;--bd:#e3e6ee;--ac:#3b5bdb;--ok:#2f9e5b;--wa:#e8890c;--er:#d6336c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141b;--card:#1b1f2a;--tx:#eceef5;--mu:#98a0b5;--bd:#2c3242;--ac:#748ffc}}
:root[data-theme="dark"]{--bg:#12141b;--card:#1b1f2a;--tx:#eceef5;--mu:#98a0b5;--bd:#2c3242;--ac:#748ffc}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:14px 20px;background:var(--card);border-bottom:1px solid var(--bd);flex-wrap:wrap}
h1{font-size:18px;margin:0}h2{font-size:16px;margin:0 0 10px}main{max-width:1050px;margin:0 auto;padding:18px}
.badge{font-size:12px;padding:2px 10px;border-radius:99px;background:var(--ac);color:#fff}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px}
button,select,input,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:9px;padding:8px 12px}
button{cursor:pointer;background:var(--ac);color:#fff;border:0}button.g{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}button.on{background:var(--ac);color:#fff}
textarea{width:100%;min-height:90px;resize:vertical}input{width:100%}label{font-size:13px;color:var(--mu);display:block;margin:8px 0 3px}
.punch{width:100%;padding:22px;font-size:20px;border-radius:14px}.in{background:var(--ok)}.out{background:var(--er)}
.clock{font-size:34px;font-weight:700;text-align:center}.mu{color:var(--mu);font-size:13px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
table{width:100%;border-collapse:collapse}th,td{padding:9px 8px;text-align:left;border-bottom:1px solid var(--bd);font-size:14px}th{color:var(--mu);font-weight:500}tr.c{cursor:pointer}tr.c:hover{background:var(--bg)}
.wrap{overflow-x:auto}.bar{height:8px;border-radius:9px;background:var(--bd);overflow:hidden;min-width:70px}.bar i{display:block;height:100%}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}.big{font-size:30px;font-weight:700}
.chip{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--bd);margin:2px 2px 0 0;display:inline-block}.chip.full{background:var(--ok);color:#fff;border:0}.chip.part{background:var(--wa);color:#fff;border:0}.chip.none{background:var(--er);color:#fff;border:0}.chip.fut{color:var(--mu)}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
</style></head><body>
<header><div class="row"><h1>⏱ WorkTime ERP</h1><span class="badge" id="role"></span></div>
<div class="row" id="nav"></div><div class="row"><button class="g" onclick="wk--;render()">‹</button><b id="wl"></b><button class="g" onclick="wk=Math.min(0,wk+1);render()">›</button></div></header>
<main id="app"><p class="mu">Loading…</p></main>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let myEmail='',myName='',claiming=0,editId=null,pq='',rmArm=null,asEmp=false,F={q:'',d:'',f:'',s:'score'},db,uid,mgr=false,wk=0,view='team',sel=null,data={staff:[],punches:[],notes:[],evals:[],settings:[]},ev={q:[3,3,3]};
const pad=n=>String(n).padStart(2,'0'),dk=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const monday=(d=new Date(),o=0)=>{const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7)+o*7);return x};
const wkey=()=>dk(monday(new Date(),wk)),hm=t=>{const d=new Date(t);return pad(d.getHours())+':'+pad(d.getMinutes())};
const col=p=>p>=90?'var(--ok)':p>=70?'var(--wa)':'var(--er)';
const bar=p=>`<div class="bar"><i style="width:${Math.min(100,p)}%;background:${col(p)}"></i></div>`;
function days(w){const m=new Date(w+'T00:00:00'),r=[];for(let i=0;i<7;i++){const d=new Date(m);d.setDate(m.getDate()+i);r.push(d)}return r}
function elapsed(w){const t=new Date();t.setHours(23,59,59);return days(w).filter((d,i)=>i<5&&d<=t).length}
function punchesOf(u,w){const s=new Date(w+'T00:00:00').getTime(),e=s+7*864e5;return data.punches.filter(p=>p.uid===u&&p.ts>=s&&p.ts<e).sort((a,b)=>a.ts-b.ts)}
function hoursByDay(ps){const o={};let open=null;ps.forEach(p=>{if(p.type==='in')open=p.ts;else if(open){const k=dk(new Date(p.ts));o[k]=(o[k]||0)+(p.ts-open)/36e5;open=null}});return o}
const tm=x=>{const[h,m]=x.split(':');return+h*60+ +m},mn=ts=>{const d=new Date(ts);return d.getHours()*60+d.getMinutes()};
const shift=()=>{const d=data.settings.find(x=>x.id==='shift');return{start:d?.start||'08:10',end:d?.end||'17:30'}};
const fm=m=>{m=Math.abs(m);return m>=60?Math.floor(m/60)+'h '+m%60+'m':m+'m'};
function timeTable(st,w){const sh=shift(),sm=tm(sh.start),em=tm(sh.end),td=dk(new Date()),H=hoursByDay(st.ps),c=(k,t)=>`<span class="chip ${k}">${t}</span>`;
 return`<table><tr><th>Day</th><th>In</th><th>Out</th><th>Hours</th><th>Notes</th></tr>${days(w).slice(0,5).map(d=>{const k=dk(d),r=st.dr[k]||{},a=r.in?mn(r.in):null,b=r.out?mn(r.out):null;
 const n1=a===null?(k<td?c('none','Absent'):''):a<sm?c('full','Arrived '+fm(sm-a)+' early'):a===sm?c('full','On time'):c('none','Late '+fm(a-sm));
 const n2=b===null?(a!==null&&k<td?c('none','No punch out'):''):b>em?c('full','Overtime '+fm(b-em)):b===em?c('full','Out on time'):c('none','Left '+fm(em-b)+' early');
 return`<tr><td>${d.toLocaleDateString([],{weekday:'short',day:'numeric'})}</td><td><b>${r.in?hm(r.in):'—'}</b></td><td><b>${r.out?hm(r.out):'—'}</b></td><td>${H[k]?H[k].toFixed(1)+' h':'—'}</td><td>${n1} ${n2}</td></tr>`}).join('')}</table>`}
function todayStr(r){const x=r.dr[dk(new Date())];return x?.in?`${hm(x.in)}–${x.out?hm(x.out):'…'}`:'—'}
function leaderboard(w){const rows=data.staff.filter(s=>!s.mgr&&s.active!==false&&!s.id.startsWith('inv:')).map(s=>({s,...stats(s,w)})).sort((a,b)=>b.score-a.score).slice(0,5),m=['🥇','🥈','🥉'];
 return`<div class="card" style="margin-top:20px"><h2>🏆 Top performers — week of ${w}</h2>${rows.length?rows.map((r,i)=>`<div class="row" style="margin:10px 0"><span style="width:30px;font-size:20px">${m[i]||i+1}</span><div style="flex:1;min-width:150px"><b>${esc(r.s.name)}</b> <span class="mu">${esc(r.s.dept)}</span>${bar(r.score)}</div><div style="text-align:right"><b style="color:${col(r.score)};font-size:20px">${Math.round(r.score)}%</b><div class="mu">Attendance ${Math.round(r.att)}% · Punctual ${Math.round(r.pun)}%</div></div></div>`).join(''):'<p class="mu">No data yet.</p>'}</div>`}
async function saveShift(){await db.collection('settings').doc('shift').set({start:$('#sst').value||'08:10',end:$('#sen').value||'17:30'});$('#shm').textContent='Saved ✓'}
function stats(s,w){const ps=punchesOf(s.id,w),by={};ps.forEach(p=>{(by[dk(new Date(p.ts))]??=[]).push(p.type)});const full=Object.values(by).filter(a=>a.includes('in')&&a.includes('out')).length,td=dk(new Date()),e5=days(w).slice(0,5).filter(d=>dk(d)<td||(dk(d)===td&&by[td])).length,exp=Math.min(s.days||5,e5),att=exp?Math.min(100,full/exp*100):0;
 const sh=shift(),sm=tm(sh.start),em=tm(sh.end),dr={};ps.forEach(p=>{const r=dr[dk(new Date(p.ts))]??={};if(p.type==='in')r.in??=p.ts;else r.out=p.ts});let onT=0;Object.values(dr).forEach(r=>{if(r.in&&r.out&&mn(r.in)<=sm&&mn(r.out)>=em)onT++});
 const nt=data.notes.filter(x=>x.uid===s.id&&(x.key===w||days(w).some(d=>dk(d)===x.key))&&x.text.trim()).length,rexp=2*elapsed(w)+2,rep=Math.min(100,nt/rexp*100);
 const e=data.evals.find(x=>x.id===s.id+'_'+w),rt=e?e.rating:null,pun=full?onT/full*100:0,score=rt?(att*.4+pun*.2+rep*.2+rt/5*100*.2):(att*.4+pun*.2+rep*.2)/.8;
 return{ps,by,dr,pun,onT,full,exp,att,rep,rt,score,e,hrs:Object.values(hoursByDay(ps)).reduce((a,b)=>a+b,0)}}
function chips(st,w){return days(w).slice(0,5).map(d=>{const a=st.by[dk(d)]||[],k=a.includes('in')&&a.includes('out')?'full':a.length?'part':dk(d)<dk(new Date())?'none':'fut';return`<span class="chip ${k}">${d.toLocaleDateString([],{weekday:'short'})} ${k==='full'?'✓':k==='part'?'½':k==='none'?'✗':''}</span>`}).join('')}
function status(u){const ps=punchesOf(u,dk(monday())).filter(p=>dk(new Date(p.ts))===dk(new Date()));return ps.length&&ps[ps.length-1].type==='in'}
async function init(){
 const user=await claude.use('user');db=await claude.use('db');
 if(!user||!db){$('#app').innerHTML='<div class="card">Please open this page signed in to your organization account.</div>';return}
 uid=await user.id();const me=await user.me();myEmail=(me.email||'').toLowerCase();myName=me.name||'';mgr=user.isOwner()||user.canEdit();$('#role').textContent=mgr?'Manager':'Employee';
 ['staff','punches','notes','evals','settings'].forEach(n=>db.collection(n).onSnapshot(s=>{data[n]=s.docs.map(d=>({id:d.id,...d.data()}));if(n==='staff')claim();render()}));
 setInterval(()=>{const c=$('#clk');if(c)c.textContent=new Date().toLocaleTimeString()},1000);render()}
async function link(){const e=$('#ge').value.trim().toLowerCase(),c=$('#gc').value.trim(),inv=data.staff.find(x=>x.id.startsWith('inv:')&&x.email===e&&x.code===c);
 if(!inv){$('#gm').textContent='Email or code not recognised';return}myEmail=e;claiming=0;claim()}
async function claim(){if(claiming||!uid||data.staff.find(x=>x.id===uid))return;
 const inv=myEmail&&data.staff.find(x=>x.id.startsWith('inv:')&&x.email===myEmail);
 if(inv){claiming=1;const{id,...r}=inv;await db.collection('staff').doc(uid).set({...r,claimed:Date.now(),active:true});await db.collection('staff').doc(id).delete()}
 else if(mgr){claiming=1;await db.collection('staff').doc(uid).set({name:myName||'Manager',email:myEmail,dept:'Management',days:5,active:true,mgr:true})}}
function render(){if(!db)return;const w=wkey();$('#wl').textContent='Week of '+w;
 if(document.activeElement?.id==='fq'){dash();return}
 if(document.activeElement?.id==='pq'){plist();return}
 if(document.activeElement&&/TEXTAREA|INPUT/.test(document.activeElement.tagName))return;
 $('#nav').innerHTML=mgr?`<button class="${asEmp?'g':'on'}" onclick="asEmp=false;render()">Manager dashboard</button><button class="${asEmp?'on':'g'}" onclick="asEmp=true;render()">Employee page</button>`:'';$('#app').innerHTML=mgr&&!asEmp?manager(w):employee(w)}
async function punch(src='web',u=uid,ts=Date.now(),type){
 const ps=data.punches.filter(p=>p.uid===u&&dk(new Date(p.ts))===dk(new Date(ts))).sort((a,b)=>a.ts-b.ts),l=ps[ps.length-1];
 if(l&&Math.abs(ts-l.ts)<5000)return;await db.collection('punches').doc(u+'_'+ts).set({uid:u,ts,type:type||(l&&l.type==='in'?'out':'in'),src})}
async function saveNote(kind,key,id){const t=$('#'+id).value;await db.collection('notes').doc(`${uid}_${kind}_${key}`).set({uid,kind,key,text:t,at:Date.now()});toast(id)}
function toast(id){const b=$('#'+id+'b');if(b){b.textContent='Saved ✓'}}
async function register(){await db.collection('staff').doc(uid).set({name:$('#rn').value.trim()||'Employee',dept:$('#rd').value,days:+$('#rdy').value||5,badge:$('#rb').value.trim(),mgr})}
function noteBox(kind,key,label,ph){const n=data.notes.find(x=>x.id===`${uid}_${kind}_${key}`),id='n'+kind.replace('-','')+'';
 return`<div class="card"><h2>${label}</h2><textarea id="${id}" placeholder="${ph}">${esc(n?.text||'')}</textarea><div class="row" style="margin-top:8px"><button id="${id}b" onclick="saveNote('${kind}','${key}','${id}')">Save</button><span class="mu">${n?'Updated '+new Date(n.at).toLocaleString():'Not submitted'}</span></div></div>`}
function ring(p){const r=42,c=2*Math.PI*r;return`<svg width="110" height="110" viewBox="0 0 110 110"><circle cx="55" cy="55" r="${r}" fill="none" stroke="var(--bd)" stroke-width="10"/><circle cx="55" cy="55" r="${r}" fill="none" stroke="${col(p)}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${c*Math.min(p,100)/100} ${c}" transform="rotate(-90 55 55)"/><text x="55" y="61" text-anchor="middle" font-size="20" font-weight="700" fill="currentColor">${Math.round(p)}%</text></svg>`}
function employee(w){const s=data.staff.find(x=>x.id===uid);
 if(!s)return`<div class="card" style="max-width:460px;margin:30px auto"><h2>Account not registered</h2><p>You are signed in as <b>${esc(myEmail||'unknown email')}</b>, but this email has not been added as an employee.</p><p class="mu">If your manager added you, enter your work email and the 6-digit code they gave you to link this account.</p><input id="ge" type="email" placeholder="Work email"><br><br><input id="gc" placeholder="6-digit code"><br><br><div class="row"><button onclick="link()">Link my account</button><span id="gm" class="mu"></span></div></div>`;
 if(s.active===false)return`<div class="card" style="max-width:460px;margin:30px auto"><h2>Account deactivated</h2><p class="mu">Please contact your manager.</p></div>`;
 const st=stats(s,w),isIn=status(uid),today=dk(new Date()),tp=punchesOf(uid,w).filter(p=>dk(new Date(p.ts))===today);
 return`<div class="grid"><div class="card"><div class="mu">Hello, ${esc(s.name)}</div><div class="clock" id="clk">${new Date().toLocaleTimeString()}</div><p class="mu" style="text-align:center">${isIn?'You are punched IN':'You are punched OUT'}</p>
 <button class="punch ${isIn?'out':'in'}" onclick="punch()">${isIn?'Punch OUT':'Punch IN'}</button>
 <p class="mu">Shift <b>${shift().start} – ${shift().end}</b></p><p class="mu">Today: ${tp.length?tp.map(p=>`<span class="dot" style="background:${p.type==='in'?'var(--ok)':'var(--er)'}"></span>${p.type.toUpperCase()} ${hm(p.ts)}`).join(' &nbsp; '):'no punches yet'}</p></div>
 <div class="card"><h2>Attendance this week</h2><div class="row" style="justify-content:space-around">${ring(st.att)}<div><div class="big">${st.full}/${st.exp}</div><div class="mu">days completed (in + out)<br>${st.ps.length} punches</div><div style="margin-top:8px">${st.hrs.toFixed(1)} h worked · Punctuality <b>${Math.round(st.pun)}%</b></div></div></div><div style="margin-top:8px">${chips(st,w)}</div></div>
 <div class="card"><h2>My performance</h2><div class="big" style="color:${col(st.score)}">${Math.round(st.score)}</div><div class="mu">Score % = attendance 40 + punctuality 20 + reports 20 + manager rating 20</div><p>Punctuality: ${Math.round(st.pun)}% ${bar(st.pun)}</p><p>Reporting: ${Math.round(st.rep)}% ${bar(st.rep)}</p><p>Manager rating: ${st.rt?st.rt.toFixed(1)+' / 5':'not rated yet'}</p>${st.e?.comment?`<p class="mu">“${esc(st.e.comment)}”</p>`:''}</div></div>
 <div class="card wrap" style="margin-top:14px"><h2>My time log — shift ${shift().start} to ${shift().end}</h2>${timeTable(st,w)}</div>
 <h2 style="margin-top:20px">Daily</h2><div class="grid">${noteBox('daily-plan',today,'Today’s plan','What will you work on today?')}${noteBox('daily-report',today,'Today’s report','What did you complete?')}</div>
 <h2 style="margin-top:20px">Weekly</h2><div class="grid">${noteBox('weekly-plan',w,'Weekly plan','Goals for this week')}${noteBox('weekly-report',w,'Weekly report','Results, blockers, learnings')}</div>${leaderboard(w)}`}
function manager(w){
 const tabs=`<div class="tabs">${[['team','Team overview'],['people','Employees'],['detail','Employee detail'],['device','Hikvision device']].map(([k,l])=>`<button class="${view===k?'on':'g'}" onclick="view='${k}';render()">${l}</button>`).join('')}</div>`;
 if(view==='device')return tabs+device();
 if(view==='people')return tabs+people();
 if(view==='detail'&&sel&&data.staff.find(x=>x.id===sel))return tabs+detail(sel,w);
 const dp=[...new Set(data.staff.filter(s=>!s.mgr).map(s=>s.dept).filter(Boolean))],o=(v,l,c)=>`<option value="${v}" ${c===v?'selected':''}>${l}</option>`;
 return tabs+`<div class="card row" style="margin-bottom:14px"><input id="fq" placeholder="🔍 Search name, department or badge…" value="${esc(F.q)}" oninput="F.q=this.value;dash()" style="flex:2;min-width:200px"><select onchange="F.d=this.value;dash()">${o('','All departments',F.d)+dp.map(d=>o(esc(d),esc(d),F.d)).join('')}</select><select onchange="F.f=this.value;dash()">${o('','All employees',F.f)+o('in','In now',F.f)+o('low','Attendance below 80%',F.f)+o('norep','Reports below 60%',F.f)}</select><select onchange="F.s=this.value;dash()">${o('score','Sort: score',F.s)+o('att','Sort: attendance',F.s)+o('name','Sort: name',F.s)}</select></div><div id="dash">${dashHtml(w)}</div>`}
function people(){const e=editId&&data.staff.find(x=>x.id===editId)||{};
 return`<div class="grid"><div class="card"><h2>${editId?'Edit employee':'Add employee'}</h2><label>Full name</label><input id="pn" value="${esc(e.name)}"><label>Work email (their login)</label><input id="pe" type="email" value="${esc(e.email)}"><label>Department</label><input id="pd" value="${esc(e.dept)}"><div class="row"><div style="flex:1"><label>Badge / employee No.</label><input id="pb" value="${esc(e.badge)}"></div><div style="flex:1"><label>Days per week</label><input id="pdy" type="number" min="1" max="7" value="${e.days||5}"></div></div><br><div class="row"><button onclick="saveEmp()">Save</button>${editId?'<button class="g" onclick="editId=null;render()">Cancel</button>':''}<span id="pmsg" class="mu"></span></div></div>
 <div class="card"><h2>Bulk import</h2><textarea id="pbulk" placeholder="name,email,department,badge,days&#10;Sara Ali,sara@company.com,Sales,1001,5"></textarea><div class="row" style="margin-top:8px"><button onclick="bulkEmp()">Import list</button><span id="pbm" class="mu"></span></div></div>
 <div class="card"><h2>How employees log in</h2><ol class="mu" style="padding-left:18px;margin:0"><li>Add the employee here with their work email.</li><li>Use this page’s <b>Share</b> menu to invite the same emails (contributor access).</li><li>They sign in with their own account and enter their email + the 6-digit code shown next to “Invited” (only needed the first time).</li><li>People not on this list see “Account not registered”.</li></ol></div><div class="card"><h2>Working hours</h2><label>Punch in by</label><input id="sst" type="time" value="${shift().start}"><label>Punch out from</label><input id="sen" type="time" value="${shift().end}"><br><br><div class="row"><button onclick="saveShift()">Save</button><span id="shm" class="mu"></span></div><p class="mu">Early arrival and overtime are allowed and shown.</p></div></div>
 <div class="card wrap" style="margin-top:14px"><div class="row" style="justify-content:space-between"><h2>Employees (${data.staff.filter(s=>!s.mgr).length})</h2><input id="pq" placeholder="🔍 Search…" style="max-width:240px" value="${esc(pq)}" oninput="pq=this.value;plist()"></div><div id="plist">${plist(1)}</div></div>`}
function plist(ret){const q=pq.toLowerCase(),rows=data.staff.filter(s=>!s.mgr&&(s.name+' '+s.email+' '+s.dept+' '+s.badge).toLowerCase().includes(q)).sort((a,b)=>(a.name||'').localeCompare(b.name||''));
 const h=`<table><tr><th>Name</th><th>Email</th><th>Dept</th><th>Badge</th><th>Days</th><th>Status</th><th></th></tr>${rows.map(r=>{const inv=r.id.startsWith('inv:'),st=inv?'Invited':r.active===false?'Inactive':'Active';return`<tr><td><b>${esc(r.name)}</b></td><td>${esc(r.email)}</td><td>${esc(r.dept)}</td><td>${esc(r.badge)||'—'}</td><td>${r.days}</td><td><span class="chip ${st==='Active'?'full':st==='Invited'?'part':'none'}">${st}</span>${inv?` <span class="mu">code <b>${esc(r.code)}</b></span>`:''}</td><td class="row">${inv?'':`<button class="g" onclick="sel='${r.id}';view='detail';render()">View</button>`}<button class="g" onclick="editId='${r.id}';render()">Edit</button><button class="g" onclick="toggleEmp('${r.id}')">${r.active===false?'Activate':'Deactivate'}</button><button class="g" onclick="rmEmp('${r.id}')">${rmArm===r.id?'Confirm?':'Remove'}</button></td></tr>`}).join('')||'<tr><td colspan="7" class="mu">No employees yet — add your first one above.</td></tr>'}</table>`;
 if(ret)return h;$('#plist').innerHTML=h}
const cd=()=>String(Math.floor(1e5+Math.random()*9e5));
const okMail=m=>/^[^\s@'"<>]+@[^\s@'"<>]+\.[^\s@'"<>]+$/.test(m);
async function saveEmp(){const g=i=>$('#'+i).value.trim(),email=g('pe').toLowerCase(),o={name:g('pn'),email,dept:g('pd'),badge:g('pb'),days:Math.min(7,Math.max(1,+g('pdy')||5))};
 if(!o.name||!okMail(email)){$('#pmsg').textContent='Name and a valid email are required';return}
 if(editId){await db.collection('staff').doc(editId).update(o);editId=null;return render()}
 if(data.staff.some(x=>x.email===email)){$('#pmsg').textContent='This email already exists';return}
 await db.collection('staff').doc('inv:'+email).set({...o,active:true,invited:Date.now(),code:cd()});render()}
async function bulkEmp(){let n=0,k=0;for(const l of $('#pbulk').value.split('\n')){const c=l.split(',').map(x=>x.trim()),email=(c[1]||'').toLowerCase();
  if(!c[0]||!okMail(email)||data.staff.some(x=>x.email===email)){if(l.trim())k++;continue}
  await db.collection('staff').doc('inv:'+email).set({name:c[0],email,dept:c[2]||'',badge:c[3]||'',days:Math.min(7,Math.max(1,+c[4]||5)),active:true,invited:Date.now(),code:cd()});n++}
 render();$('#pbm')&&($('#pbm').textContent=`Added ${n}, skipped ${k}`)}
async function toggleEmp(id){const r=data.staff.find(x=>x.id===id);await db.collection('staff').doc(id).update({active:r.active===false})}
async function rmEmp(id){if(rmArm!==id){rmArm=id;plist();return}rmArm=null;await db.collection('staff').doc(id).delete()}
function dash(){$('#dash').innerHTML=dashHtml(wkey())}
function dashHtml(w){const q=F.q.toLowerCase();
 const rows=data.staff.filter(s=>!s.mgr&&s.active!==false&&!s.id.startsWith('inv:')).map(s=>({s,...stats(s,w)})).filter(r=>(!q||(r.s.name+' '+r.s.dept+' '+r.s.badge).toLowerCase().includes(q))&&(!F.d||r.s.dept===F.d)&&(F.f!=='in'||status(r.s.id))&&(F.f!=='low'||r.att<80)&&(F.f!=='norep'||r.rep<60))
  .sort((a,b)=>F.s==='name'?a.s.name.localeCompare(b.s.name):b[F.s]-a[F.s]);
 const avg=k=>rows.length?Math.round(rows.reduce((a,r)=>a+r[k],0)/rows.length):0,ds=days(w).slice(0,5);
 const pres=ds.map(d=>rows.filter(r=>r.by[dk(d)]).length),full=ds.map(d=>rows.filter(r=>(r.by[dk(d)]||[]).includes('out')).length),mx=Math.max(1,rows.length);
 const tr=[-5,-4,-3,-2,-1,0].map(o=>{const k=dk(monday(new Date(w+'T00:00:00'),o));return{k,v:rows.length?rows.reduce((a,r)=>a+stats(r.s,k).att,0)/rows.length:0}});
 const ch1=`<svg viewBox="0 0 300 150" width="100%">${ds.map((d,i)=>{const h=pres[i]/mx*100;return`<rect x="${i*58+14}" y="${115-h}" width="34" height="${h}" rx="5" fill="var(--ac)"/><text x="${i*58+31}" y="${109-h}" text-anchor="middle" font-size="12" fill="currentColor">${pres[i]}</text><text x="${i*58+31}" y="132" text-anchor="middle" font-size="11" fill="var(--mu)">${d.toLocaleDateString([],{weekday:'short'})}</text>`}).join('')}</svg>`;
 const ch2=`<svg viewBox="0 0 300 ${rows.length*24+8}" width="100%">${rows.map((r,i)=>`<text x="0" y="${i*24+17}" font-size="11" fill="currentColor">${esc(r.s.name.slice(0,13))}</text><rect x="92" y="${i*24+6}" width="150" height="12" rx="6" fill="var(--bd)"/><rect x="92" y="${i*24+6}" width="${r.att*1.5}" height="12" rx="6" fill="${col(r.att)}"/><text x="248" y="${i*24+17}" font-size="11" fill="currentColor">${r.full}/${r.exp} · ${Math.round(r.att)}%</text>`).join('')}</svg>`;
 const pts=tr.map((t,i)=>[20+i*52,105-t.v*0.9]);
 const ch3=`<svg viewBox="0 0 300 150" width="100%"><polyline fill="none" stroke="var(--ac)" stroke-width="3" points="${pts.map(p=>p.join(',')).join(' ')}"/>${tr.map((t,i)=>`<circle cx="${pts[i][0]}" cy="${pts[i][1]}" r="4" fill="var(--ac)"/><text x="${pts[i][0]}" y="${pts[i][1]-9}" text-anchor="middle" font-size="11" fill="currentColor">${Math.round(t.v)}%</text><text x="${pts[i][0]}" y="132" text-anchor="middle" font-size="10" fill="var(--mu)">${t.k.slice(5)}</text>`).join('')}</svg>`;
 return`<div class="grid" style="margin-bottom:14px"><div class="card"><div class="mu">Employees (filtered)</div><div class="big">${rows.length}</div></div><div class="card"><div class="mu">Currently in</div><div class="big">${rows.filter(r=>status(r.s.id)).length}</div></div><div class="card"><div class="mu">Avg attendance</div><div class="big" style="color:${col(avg('att'))}">${avg('att')}%</div></div><div class="card"><div class="mu">Avg score</div><div class="big">${avg('score')}</div></div></div>
 <div class="grid" style="margin-bottom:14px"><div class="card"><h2>Employees present per day</h2>${ch1}</div><div class="card"><h2>Attendance by employee (days)</h2>${rows.length?ch2:'<p class="mu">No data</p>'}</div><div class="card"><h2>Team attendance trend (6 weeks)</h2>${ch3}</div></div>
 <div class="card wrap"><h2>Team performance — click a row</h2><table><tr><th>Employee</th><th>Now</th><th>Days</th><th>Attendance</th><th>Punctual</th><th>Today</th><th>Reports</th><th>Rating</th><th>Score</th></tr>
 ${rows.map(r=>`<tr class="c" onclick="sel='${r.s.id}';view='detail';render()"><td><b>${esc(r.s.name)}</b><div class="mu">${esc(r.s.dept)}</div></td><td><span class="dot" style="background:${status(r.s.id)?'var(--ok)':'var(--mu)'}"></span>${status(r.s.id)?'In':'Out'}</td><td>${r.full}/${r.exp}<div>${chips(r,w)}</div></td><td>${Math.round(r.att)}%${bar(r.att)}</td><td>${Math.round(r.pun)}%</td><td>${todayStr(r)}</td><td>${Math.round(r.rep)}%${bar(r.rep)}</td><td>${r.rt?r.rt.toFixed(1):'—'}</td><td><b style="color:${col(r.score)}">${Math.round(r.score)}</b></td></tr>`).join('')||'<tr><td colspan="9" class="mu">No employees match. Employees create a profile on their first visit.</td></tr>'}</table></div>${leaderboard(w)}`}
function detail(id,w){const s=data.staff.find(x=>x.id===id),st=stats(s,w),h=hoursByDay(st.ps),ds=days(w).slice(0,5),mx=Math.max(9,...Object.values(h));
 const trend=[-3,-2,-1,0].map(o=>{const k=dk(monday(new Date(w+'T00:00:00'),o));return{k,sc:stats(s,k).score}});
 const nt=data.notes.filter(x=>x.uid===id&&(x.key===w||days(w).some(d=>dk(d)===x.key))).sort((a,b)=>a.key<b.key?-1:1);
 const stars=i=>[1,2,3,4,5].map(v=>`<button class="${ev.q[i]===v?'on':'g'}" onclick="ev.q[${i}]=${v};ev.keep=1;render()">${v}</button>`).join(' ');
 if(ev.id!==id+w){ev={id:id+w,q:st.e?.q||[3,3,3],c:st.e?.comment||''}}
 return`<div class="row" style="margin-bottom:10px"><button class="g" onclick="view='team';render()">← Team</button><h2 style="margin:0">${esc(s.name)} <span class="mu">${esc(s.dept)} · badge ${esc(s.badge||'—')}</span></h2></div>
 <div class="grid"><div class="card"><h2>Hours by day</h2><svg viewBox="0 0 300 140" width="100%">${ds.map((d,i)=>{const v=h[dk(d)]||0,bh=v/mx*100;return`<rect x="${i*60+12}" y="${110-bh}" width="36" height="${bh}" rx="5" fill="var(--ac)"/><text x="${i*60+30}" y="125" text-anchor="middle" font-size="11" fill="var(--mu)">${d.toLocaleDateString([],{weekday:'short'})}</text><text x="${i*60+30}" y="${104-bh}" text-anchor="middle" font-size="11" fill="currentColor">${v?v.toFixed(1):''}</text>`}).join('')}</svg><div>${chips(st,w)}</div><div class="mu">${st.full} of ${st.exp} days = <b>${Math.round(st.att)}%</b> · ${st.hrs.toFixed(1)} h worked</div></div>
 <div class="card"><h2>Score trend (4 weeks)</h2><svg viewBox="0 0 300 140" width="100%">${trend.map((t,i)=>`<rect x="${i*72+16}" y="${110-t.sc}" width="44" height="${t.sc}" rx="5" fill="${col(t.sc)}"/><text x="${i*72+38}" y="${104-t.sc}" text-anchor="middle" font-size="12" fill="currentColor">${Math.round(t.sc)}</text><text x="${i*72+38}" y="127" text-anchor="middle" font-size="10" fill="var(--mu)">${t.k.slice(5)}</text>`).join('')}</svg></div>
 <div class="card"><h2>Evaluation (this week)</h2><div class="mu">Quality of work</div>${stars(0)}<div class="mu" style="margin-top:8px">Productivity</div>${stars(1)}<div class="mu" style="margin-top:8px">Teamwork &amp; initiative</div>${stars(2)}<label>Comment</label><textarea id="ec">${esc(ev.c)}</textarea><br><br><button onclick="saveEval('${id}','${w}')">Save evaluation</button></div></div>
 <div class="card" style="margin-top:14px"><h2>Plans &amp; reports this week</h2>${nt.length?nt.map(n=>`<p><b>${n.kind.replace('-',' ')}</b> <span class="mu">${n.key}</span><br>${esc(n.text)||'<i class="mu">empty</i>'}</p>`).join(''):'<p class="mu">Nothing submitted.</p>'}</div>
 <div class="card wrap" style="margin-top:14px"><h2>Time log — shift ${shift().start} to ${shift().end}</h2>${timeTable(st,w)}</div>`}
async function saveEval(id,w){const q=ev.q,c=$('#ec').value;await db.collection('evals').doc(id+'_'+w).set({uid:id,week:w,q,comment:c,rating:q.reduce((a,b)=>a+b,0)/3});ev.id=null}
function device(){return`<div class="grid"><div class="card"><h2>Hikvision DS-K3B411SX</h2><p class="mu">A web page cannot talk to the barrier directly (it sits on your LAN). Run a small bridge service that listens to the device’s access events (ISAPI HTTP listening / <code>/ISAPI/AccessControl/AcsEvent</code>) and forwards each valid pass as JSON. Paste or import those events here. Each employee’s <b>badge / employee No.</b> must match the one enrolled on the device.</p><p class="mu">Format:<br><code>[{"employeeNo":"1001","time":"2026-10-07T08:02:11+03:00"}]</code></p></div>
 <div class="card"><h2>Import device events</h2><textarea id="imp" placeholder='[{"employeeNo":"1001","time":"..."}]'></textarea><div class="row" style="margin-top:8px"><button onclick="imp()">Import</button><span id="impr" class="mu"></span></div><p class="mu">In/Out alternate per day for each person. Re-importing the same events is safe.</p></div></div>`}
async function imp(){try{const a=JSON.parse($('#imp').value).map(e=>({s:data.staff.find(x=>x.badge&&x.badge===String(e.employeeNo)),t:new Date(e.time).getTime()})).sort((a,b)=>a.t-b.t);let n=0,m=0;
 const seen={};for(const e of a){if(!e.s||isNaN(e.t)){m++;continue}const k=e.s.id+dk(new Date(e.t));const c=seen[k]??=data.punches.filter(p=>p.uid===e.s.id&&dk(new Date(p.ts))===dk(new Date(e.t))).length;
  await db.collection('punches').doc(e.s.id+'_'+e.t).set({uid:e.s.id,ts:e.t,type:c%2?'out':'in',src:'device'});seen[k]++;n++}
 $('#impr').textContent=`Imported ${n}, skipped ${m} (unknown badge or bad time).`}catch(x){$('#impr').textContent='Invalid JSON'}}
init();

</script></body></html>
