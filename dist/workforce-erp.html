<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>IRack IT Solution · WorkTime ERP</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{--bg:#f5f6fa;--card:#fff;--tx:#1b1f2a;--mu:#6b7285;--bd:#e3e6ee;--ac:#3b5bdb;--ok:#2f9e5b;--wa:#e8890c;--er:#d6336c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141b;--card:#1b1f2a;--tx:#eceef5;--mu:#98a0b5;--bd:#2c3242;--ac:#748ffc}}
:root[data-theme="dark"]{--bg:#12141b;--card:#1b1f2a;--tx:#eceef5;--mu:#98a0b5;--bd:#2c3242;--ac:#748ffc}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:14px 20px;background:var(--card);border-bottom:1px solid var(--bd);flex-wrap:wrap}
h1{font-size:18px;margin:0}h2{font-size:16px;margin:0 0 10px}main{max-width:1050px;margin:0 auto;padding:18px}
.brandHeading{gap:10px}.brandHeading .brandLogo{width:42px;height:42px;border-radius:50%;object-fit:cover;flex:none}
.badge{font-size:12px;padding:2px 10px;border-radius:99px;background:var(--ac);color:#fff}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px}
button,select,input,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:9px;padding:8px 12px}
button{cursor:pointer;background:var(--ac);color:#fff;border:0}button.g{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}button.on{background:var(--ac);color:#fff}
textarea{width:100%;min-height:90px;resize:vertical}input{width:100%}label{font-size:13px;color:var(--mu);display:block;margin:8px 0 3px}
.punch{width:100%;padding:22px;font-size:20px;border-radius:14px}.in{background:var(--ok)}.out{background:var(--er)}
.clock{font-size:34px;font-weight:700;text-align:center}.mu{color:var(--mu);font-size:13px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
table{width:100%;border-collapse:collapse}th,td{padding:9px 8px;text-align:left;border-bottom:1px solid var(--bd);font-size:14px}th{color:var(--mu);font-weight:500}tr.c{cursor:pointer}tr.c:hover{background:var(--bg)}
.wrap{overflow-x:auto}.bar{height:8px;border-radius:9px;background:var(--bd);overflow:hidden;min-width:70px}.bar i{display:block;height:100%}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}.big{font-size:30px;font-weight:700}
.chip{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--bd);margin:2px 2px 0 0;display:inline-block}.chip.full{background:var(--ok);color:#fff;border:0}.chip.part{background:var(--wa);color:#fff;border:0}.chip.none{background:var(--er);color:#fff;border:0}.chip.fut{color:var(--mu)}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}

/* --- Full-page dedicated auth layout --- */
body.authView{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--card);padding:24px;}
body.authView header{display:none !important}
body.authView main{max-width:420px;width:100%;margin:0;padding:0}
.authShell{background:var(--card);border:1px solid var(--bd);border-radius:18px;box-shadow:0 10px 30px rgba(15,23,42,.08),0 2px 8px rgba(15,23,42,.04);padding:28px 26px;width:100%}
.authShell .brandRow{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.authShell .brandRow .brandLogo{width:42px;height:42px;border-radius:50%;object-fit:cover;flex:none}
.authShell h2{font-size:22px;margin:2px 0 4px}
.authShell .sub{color:var(--mu);font-size:14px;margin-bottom:20px}
.authField{margin-bottom:14px;position:relative}
.authField input{width:100%;height:48px;border-radius:12px;padding:14px 14px 14px 14px;border:1px solid var(--bd);background:var(--bg);font-size:15px;transition:border-color .15s,box-shadow .15s}
.authField input:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb, var(--ac) 22%, transparent)}
.authField label{display:block;margin:0 2px 6px;font-size:13px;color:var(--mu)}
.authField .pwToggle{position:absolute;right:10px;top:32px;border:0;background:transparent;color:var(--mu);cursor:pointer;padding:4px 8px;border-radius:8px;font-size:13px}
.authField .pwToggle:hover{background:var(--bg)}
.authBtn{width:100%;height:48px;border-radius:12px;background:var(--ac);color:#fff;font-weight:600;font-size:15px;margin-top:6px;border:0}
.authBtn:disabled{opacity:.6;cursor:not-allowed}
.authSubRow{display:flex;align-items:center;justify-content:space-between;margin-top:14px;color:var(--mu);font-size:14px}
.authSubRow a,.authSubRow button.link,.authForgot button.link{background:transparent;border:0;padding:0;color:var(--ac);font-weight:600;cursor:pointer;text-decoration:underline}
.authForgot{display:flex;justify-content:flex-end;margin:-6px 2px 12px;font-size:13px}
.authShell .amWrap{min-height:0;margin-top:10px;color:var(--er);font-size:13px;line-height:1.45}
.authShell .amWrap:not(:empty){padding:10px 12px;border:1px solid color-mix(in srgb,var(--er) 28%,transparent);border-radius:10px;background:color-mix(in srgb,var(--er) 8%,var(--card))}
.authShell .footNote{text-align:center;color:var(--mu);font-size:12px;margin-top:16px}
@media(max-height:700px){body.authView{align-items:flex-start;padding-block:16px}}
@media(max-width:480px){body.authView{padding:16px}.authShell{padding:24px 20px}}

/* --- Employee Analytics & Plans Styling --- */
.empBanner{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;background:linear-gradient(135deg,var(--card) 0%,color-mix(in srgb,var(--ac) 10%,var(--card)) 100%);border:1px solid var(--bd);border-radius:14px;padding:16px 20px;margin-bottom:14px}
.statGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:14px}
.statCard{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;justify-content:space-between}
.statCard .statLabel{font-size:12px;color:var(--mu);text-transform:uppercase;letter-spacing:.5px;font-weight:600;margin-bottom:4px}
.statCard .statVal{font-size:26px;font-weight:700;line-height:1.2}
.statCard .statSub{font-size:12px;color:var(--mu);margin-top:6px}
.dayNav{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:10px 0}
.dayPill{background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:20px;padding:6px 14px;font-size:13px;font-weight:500;cursor:pointer;transition:all .15s}
.dayPill:hover{border-color:var(--ac)}
.dayPill.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.dayPill.today{border-width:2px}
.callout{padding:12px 16px;border-radius:10px;font-size:13px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.callout.info{background:color-mix(in srgb,var(--ac) 12%,transparent);border:1px solid color-mix(in srgb,var(--ac) 30%,transparent);color:var(--tx)}
.callout.warn{background:color-mix(in srgb,var(--wa) 14%,transparent);border:1px solid color-mix(in srgb,var(--wa) 35%,transparent);color:var(--tx)}
.callout.success{background:color-mix(in srgb,var(--ok) 14%,transparent);border:1px solid color-mix(in srgb,var(--ok) 35%,transparent);color:var(--tx)}
.refBox{background:var(--bg);border:1px dashed var(--bd);border-radius:10px;padding:12px 14px;margin:10px 0;font-size:13px}
.histItem{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:10px;transition:box-shadow .15s}
.histItem:hover{box-shadow:0 2px 8px rgba(0,0,0,.04)}
.histItem .histHeader{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:8px;border-bottom:1px solid var(--bd);padding-bottom:6px}
.histItem pre{margin:0;font:inherit;white-space:pre-wrap;word-break:break-word;color:var(--tx)}
.filterPill{background:var(--bg);border:1px solid var(--bd);border-radius:14px;padding:4px 12px;font-size:12px;cursor:pointer}
.filterPill.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
</style></head><body>

 const n1=a===null?(k<td?c('none','Absent'):''):a<sm?c('full','Arrived '+fm(sm-a)+' early'):a===sm?c('full','On time'):c('none','Late '+fm(a-sm));
 const n2=b===null?(a!==null&&k<td?c('none','No punch out'):''):b>em?c('full','Overtime '+fm(b-em)):b===em?c('full','Out on time'):c('none','Left '+fm(em-b)+' early');
 const u=st.uid||uid;

 return`<tr><td><b>${d.toLocaleDateString([],{weekday:'short',day:'numeric'})}</b></td><td>${r.in?hm(r.in):'—'}</td><td>${r.out?hm(r.out):'—'}</td><td>${H[k]?H[k].toFixed(1)+' h':'—'}</td><td>${n1} ${n2}</td><td>${pChip} ${rChip}</td></tr>`}).join('')}</table>`}
function todayStr(r){const x=r.dr[dk(new Date())];return x?.in?`${hm(x.in)}–${x.out?hm(x.out):'…'}`:'—'}
function stats(s,w){const ps=punchesOf(s.id,w),by={};ps.forEach(p=>{(by[dk(new Date(p.ts))]??=[]).push(p.type)});const full=Object.values(by).filter(a=>a.includes('in')&&a.includes('out')).length,td=dk(new Date()),e5=days(w).slice(0,5).filter(d=>dk(d)<td||(dk(d)===td&&by[td])).length,exp=Math.min(s.days||5,e5),att=exp?Math.min(100,full/exp*100):0;
 const sh=shift(),sm=tm(sh.start),em=tm(sh.end),dr={};ps.forEach(p=>{const r=dr[dk(new Date(p.ts))]??={};if(p.type==='in')r.in??=p.ts;else r.out=p.ts});let onT=0;Object.values(dr).forEach(r=>{if(r.in&&r.out&&mn(r.in)<=sm&&mn(r.out)>=em)onT++});
 const nt=data.notes.filter(x=>x.uid===s.id&&(x.key===w||days(w).some(d=>dk(d)===x.key))&&x.text.trim()).length,rexp=2*elapsed(w)+2,rep=Math.min(100,nt/rexp*100);
 const e=data.evals.find(x=>x.id===s.id+'_'+w),rt=e?e.rating:null,pun=full?onT/full*100:0,score=rt?(att*.4+pun*.2+rep*.2+rt/5*100*.2):(att*.4+pun*.2+rep*.2)/.8;
 return{uid:s.id,ps,by,dr,pun,onT,full,exp,att,rep,rt,score,e,hrs:Object.values(hoursByDay(ps)).reduce((a,b)=>a+b,0)}}
function chips(st,w){return days(w).slice(0,5).map(d=>{const a=st.by[dk(d)]||[],k=a.includes('in')&&a.includes('out')?'full':a.length?'part':dk(d)<dk(new Date())?'none':'fut';return`<span class="chip ${k}">${d.toLocaleDateString([],{weekday:'short'})} ${k==='full'?'✓':k==='part'?'½':k==='none'?'✗':''}</span>`}).join('')}

function employee(w){
  if(mgr && !asEmp) {
    return `<div class="card" style="max-width:520px;margin:40px auto">
      <h2>Managers use the Manager dashboard</h2>
      <p class="mu">Click <b>Employee preview</b> in the top bar if you want to inspect this view, or switch back to Manager dashboard.</p>
      <div class="row" style="gap:10px;justify-content:center">
        <button class="on" onclick="asEmp=false;render()">Go to Manager dashboard</button>
        <button class="g" onclick="asEmp=true;render()">Continue preview Employee page</button>
      </div>
    </div>`;
  }
  const s = data.staff.find(x => x.id === uid);
  if(!s) return `<div class="card" style="max-width:460px;margin:30px auto"><p class="mu">Loading user profile…</p></div>`;
  if(s.active === false) return `<div class="card" style="max-width:460px;margin:30px auto"><h2>Account deactivated</h2><p class="mu">Please contact your manager or HR administrator.</p></div>`;

  const st = stats(s, w), isIn = status(uid);
  const now = new Date();
  const today = dk(now);
  const curDayOfWeek = now.getDay(); // 0: Sun, 1: Mon, ... 5: Fri, 6: Sat
  const isMonday = curDayOfWeek === 1;
  const isFriday = curDayOfWeek === 5;
  const isPastFriday = curDayOfWeek >= 5 || curDayOfWeek === 0;

  // Selected Day for Daily Plan & Report
  const viewDayDate = (() => { const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate() + dOffset); return d; })();
  const viewDay = dk(viewDayDate);
  const viewDayLabel = viewDayDate.toLocaleDateString([], { weekday: 'long', month: 'short', day: 'numeric', year: 'numeric' });
  const daysFromToday = Math.round((viewDayDate - new Date(today + 'T00:00:00')) / 864e5);
  const isViewingToday = daysFromToday === 0;

  // Week bounds
  const weekStart = new Date(w + 'T00:00:00');
  const weekEnd = new Date(weekStart); weekEnd.setDate(weekEnd.getDate() + 4);
  const weekLabel = weekStart.toLocaleDateString([], { month: 'short', day: 'numeric' }) + ' – ' + weekEnd.toLocaleDateString([], { month: 'short', day: 'numeric', year: 'numeric' });

  // Punches & Shifts
  const tp = punchesOf(uid, w).filter(p => dk(new Date(p.ts)) === today);
  const sh = shift();
  const sm = tm(sh.start), em = tm(sh.end);
  const hByDay = hoursByDay(st.ps);
  const weekDays = days(w).slice(0, 5); // Mon - Fri

  // --- ANALYTICS CALCULATIONS ---
  // 1. Daily hours & SVG Chart
  const dailyHoursData = weekDays.map(d => {
    const k = dk(d);
    const hrs = hByDay[k] || 0;
    const r = st.dr[k] || {};
    return {
      date: k,
      dayName: d.toLocaleDateString([], { weekday: 'short' }),
      dayNum: d.getDate(),
      hrs,
      hasPunchIn: !!r.in,
      hasPunchOut: !!r.out,
      punchInMin: r.in ? mn(r.in) : null,
      punchOutMin: r.out ? mn(r.out) : null
    };
  });
  const maxDayH = Math.max(9, ...dailyHoursData.map(x => x.hrs));

  // 2. Shift & Punctuality metrics
  let earlyArrivalCount = 0, onTimeArrivalCount = 0, lateArrivalCount = 0;
  let totalArrivalMinSum = 0, arrivalsRecorded = 0;
  dailyHoursData.forEach(x => {
    if (x.punchInMin !== null) {
      arrivalsRecorded++;
      totalArrivalMinSum += x.punchInMin;
      if (x.punchInMin < sm) earlyArrivalCount++;
      else if (x.punchInMin === sm) onTimeArrivalCount++;
      else lateArrivalCount++;
    }
  });
  const avgArrivalMin = arrivalsRecorded ? Math.round(totalArrivalMinSum / arrivalsRecorded) : null;
  const avgArrivalStr = avgArrivalMin !== null ? `${pad(Math.floor(avgArrivalMin / 60))}:${pad(avgArrivalMin % 60)}` : '—';
  const expectedWeekHours = (st.exp || 1) * 8.0;
  const hoursOverOrUnder = st.hrs - expectedWeekHours;
  const avgHoursPerDay = st.full > 0 ? (st.hrs / st.full).toFixed(1) : (st.hrs > 0 ? st.hrs.toFixed(1) : '0.0');

  // 3. Multi-week Personal Trend (Past 6 weeks)
  const personalTrend = [-5, -4, -3, -2, -1, 0].map(offset => {
    const mondayKey = dk(monday(new Date(w + 'T00:00:00'), offset));
    const sStat = stats(s, mondayKey);
    return { key: mondayKey, score: Math.round(sStat.score), att: Math.round(sStat.att), hrs: sStat.hrs };
  });

  // SVG Chart: Daily Hours Bar Chart (viewBox 0 0 320 140)
  const targetLineY = 110 - (8.0 / maxDayH * 90);
  const dailyHoursBars = dailyHoursData.map((d, i) => {
    const x = i * 60 + 16;
    const barH = d.hrs > 0 ? Math.max(4, (d.hrs / maxDayH * 90)) : 0;
    const y = 110 - barH;
    const barColor = d.hrs >= 8.0 ? 'var(--ok)' : d.hrs >= 4.0 ? 'var(--ac)' : d.hrs > 0 ? 'var(--wa)' : 'var(--bd)';
    return `
      <rect x="${x}" y="${y}" width="36" height="${barH}" rx="5" fill="${barColor}" />
      <text x="${x + 18}" y="125" text-anchor="middle" font-size="11" fill="var(--mu)">${d.dayName}</text>
      <text x="${x + 18}" y="${Math.max(12, y - 5)}" text-anchor="middle" font-size="11" font-weight="600" fill="currentColor">${d.hrs ? d.hrs.toFixed(1) + 'h' : '—'}</text>
    `;
  }).join('');
  const dailyHoursChartSvg = `
    <svg viewBox="0 0 320 140" width="100%">
      <line x1="10" y1="${targetLineY}" x2="310" y2="${targetLineY}" stroke="var(--mu)" stroke-width="1" stroke-dasharray="4 3" opacity="0.6"/>
      <text x="312" y="${targetLineY + 3}" text-anchor="end" font-size="9" fill="var(--mu)">8h target</text>
      ${dailyHoursBars}
    </svg>
  `;

  // SVG Chart: 6-Week Performance Trend (viewBox 0 0 320 140)
  const trendPoints = personalTrend.map((t, i) => [24 + i * 54, 110 - (t.score * 0.9)]);
  const trendPolyline = trendPoints.map(p => p.join(',')).join(' ');
  const trendChartSvg = `
    <svg viewBox="0 0 320 140" width="100%">
      <line x1="15" y1="110" x2="310" y2="110" stroke="var(--bd)" stroke-width="1" />
      <polyline fill="none" stroke="var(--ac)" stroke-width="3" points="${trendPolyline}" />
      ${personalTrend.map((t, i) => `
        <circle cx="${trendPoints[i][0]}" cy="${trendPoints[i][1]}" r="4" fill="var(--ac)" />
        <text x="${trendPoints[i][0]}" y="${trendPoints[i][1] - 8}" text-anchor="middle" font-size="11" font-weight="600" fill="currentColor">${t.score}%</text>
        <text x="${trendPoints[i][0]}" y="127" text-anchor="middle" font-size="10" fill="var(--mu)">${t.key.slice(5)}</text>
      `).join('')}
    </svg>

  // --- WEEKLY NOTES (Monday Plan & Friday Report) ---
  const wpNote = data.notes.find(x => x.uid === uid && x.kind === 'weekly-plan' && x.key === w);
  const wrNote = data.notes.find(x => x.uid === uid && x.kind === 'weekly-report' && x.key === w);
  const wpDone = !!(wpNote && wpNote.text.trim());
  const wrDone = !!(wrNote && wrNote.text.trim());

  // Last week's reference
  const prevMondayKey = dk(monday(new Date(w + 'T00:00:00'), -1));
  const prevWpNote = data.notes.find(x => x.uid === uid && x.kind === 'weekly-plan' && x.key === prevMondayKey);

  // --- DAILY NOTES (Daily Plan & Report) ---

    .filter(x => x.uid === uid && x.kind === 'daily-plan' && x.key < viewDay && x.text && x.text.trim())
    .sort((a,b) => b.key.localeCompare(a.key));
  const lastDailyPlan = allPastDailyPlans[0] || null;

  // Day picker pills for current week
  const dayPillsHtml = weekDays.map((d, i) => {
    const k = dk(d);
    const isCurView = k === viewDay;
    const isTodayDate = k === today;
    const diff = Math.round((d - new Date(today + 'T00:00:00')) / 864e5);
    const dayHasPlan = data.notes.some(x => x.uid === uid && x.kind === 'daily-plan' && x.key === k && x.text.trim());
    const dayHasRep = data.notes.some(x => x.uid === uid && x.kind === 'daily-report' && x.key === k && x.text.trim());
    return `
      <button class="dayPill ${isCurView ? 'on' : ''} ${isTodayDate ? 'today' : ''}" onclick="dOffset=${diff};render()">
        ${d.toLocaleDateString([], { weekday: 'short', day: 'numeric' })}

        ${dayHasPlan && dayHasRep ? '✓' : dayHasPlan ? '·' : ''}
      </button>
    `;
  }).join('');

  // --- PREVIOUS PLANS ARCHIVE ---
  // Get all employee notes sorted newest first

function renderPlanHistItems(targetKey, isToday){
  targetKey = targetKey || dk(new Date());
  const allUserNotes = (data.notes || [])
    .filter(x => x.uid === uid && x.text && x.text.trim())
    .sort((a,b) => (b.key || '').localeCompare(a.key || '') || (b.at || 0) - (a.at || 0));

  const filteredHistory = allUserNotes.filter(n => {
    if (planHistFilter !== 'all' && n.kind !== planHistFilter) return false;
    if (planHistQuery) {
      const q = planHistQuery.toLowerCase();
      return (n.key || '').toLowerCase().includes(q) || (n.text || '').toLowerCase().includes(q) || (n.kind || '').toLowerCase().includes(q);
    }
    return true;
  });

  const kindLabels = {
    'daily-plan': 'Daily Plan',
    'daily-report': 'Daily Report',
    'weekly-plan': 'Weekly Plan',
    'weekly-report': 'Weekly Report'
  };

  const kindColors = {
    'daily-plan': 'var(--ac)',
    'daily-report': 'var(--ok)',
    'weekly-plan': '#9c27b0',
    'weekly-report': '#e91e63'
  };

  if(!filteredHistory.length) return `<p class="mu" style="text-align:center;padding:20px">No matching plans or reports found in archive.</p>`;

  return filteredHistory.map(item => `
    <div class="histItem">
      <div class="histHeader">
        <div class="row" style="gap:8px">
          <span class="chip" style="background:${kindColors[item.kind] || 'var(--ac)'};color:#fff;font-weight:600">${kindLabels[item.kind] || item.kind}</span>
          <b>${item.key}</b>
          <span class="mu" style="font-size:12px">${new Date(item.key + 'T00:00:00').toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' })}</span>
        </div>
        <div class="row" style="gap:6px">
          <span class="mu" style="font-size:11px">Updated ${new Date(item.at).toLocaleString()}</span>
          ${item.kind.includes('plan') ? `
            <button class="g" style="padding:2px 8px;font-size:11px" onclick="copyTextToField('n_dailyplan_${targetKey.replace(/-/g,'_')}', \`${esc(item.text)}\`)">Copy to plan</button>
          ` : ''}
        </div>
      </div>
      <pre>${esc(item.text)}</pre>
    </div>
  `).join('');
}

function filterPlanHist(kind, targetKey, isToday){
  planHistFilter = kind;
  const list = document.getElementById('histEntriesList');
  if(list) list.innerHTML = renderPlanHistItems(targetKey, isToday);
  document.querySelectorAll('.filterPill').forEach(p => {
    p.classList.toggle('on', p.dataset.kind === kind);
  });
}

function searchPlanHist(query, targetKey, isToday){
  planHistQuery = query;
  const list = document.getElementById('histEntriesList');
  if(list) list.innerHTML = renderPlanHistItems(targetKey, isToday);
}

 const h=`<table><tr><th>Name</th><th>Email</th><th>Dept</th><th>Badge</th><th>Days</th><th>Status</th><th></th></tr>${rows.map(r=>{const inv=r.id.startsWith('inv:'),st=inv?'Invited':r.active===false?'Inactive':'Active';return`<tr><td><b>${esc(r.name)}</b></td><td>${esc(r.email)}</td><td>${esc(r.dept)}</td><td>${esc(r.badge)||'—'}</td><td>${r.days}</td><td><span class="chip ${st==='Active'?'full':st==='Invited'?'part':'none'}">${st}</span>${inv?` <span class="mu">pwd <b>${esc(r.code)}</b></span>`:''}</td><td class="row">${inv?'':`<button class="g" onclick="sel='${r.id}';view='detail';render()">View</button>`}<button class="g" onclick="editId='${r.id}';render()">Edit</button><button class="g" onclick="toggleEmp('${r.id}')">${r.active===false?'Activate':'Deactivate'}</button><button class="g" onclick="rmEmp('${r.id}')">${rmArm===r.id?'Confirm?':'Remove'}</button></td></tr>`}).join('')||'<tr><td colspan="7" class="mu">No employees yet — add your first one above.</td></tr>'}</table>`;
 if(ret)return h;$('#plist').innerHTML=h}
async function saveEmp(){const g=i=>$('#'+i)?$('#'+i).value.trim():'',email=g('pe').toLowerCase(),o={name:g('pn'),email,dept:g('pd'),badge:g('pb'),days:Math.min(7,Math.max(1,+g('pdy')||5))};
 if(!o.name||!okMail(email)){$('#pmsg').textContent='Name and a valid @iracktech.com email are required';return}
 if(editId){await db.collection('staff').doc(editId).update(o);editId=null;return render()}
 if(data.staff.some(x=>x.email===email)){$('#pmsg').textContent='This email already exists';return}
 const pwd = g('ppw') || cd();
 await db.collection('staff').doc('inv:'+email).set({...o,active:true,invited:Date.now(),code:pwd});render()}
async function bulkEmp(){let n=0,k=0;for(const l of $('#pbulk').value.split('\n')){const c=l.split(',').map(x=>x.trim()),email=(c[1]||'').toLowerCase();
  if(!c[0]||!okMail(email)||data.staff.some(x=>x.email===email)){if(l.trim())k++;continue}
  await db.collection('staff').doc('inv:'+email).set({name:c[0],email,dept:c[2]||'',badge:c[3]||'',days:Math.min(7,Math.max(1,+c[4]||5)),active:true,invited:Date.now(),code:cd()});n++}
 render();$('#pbm')&&($('#pbm').textContent=`Added ${n}, skipped ${k}`)}
async function toggleEmp(id){const r=data.staff.find(x=>x.id===id);await db.collection('staff').doc(id).update({active:r.active===false})}
async function rmEmp(id){if(rmArm!==id){rmArm=id;plist();return}rmArm=null;await db.collection('staff').doc(id).delete()}

function detail(id,w){const s=data.staff.find(x=>x.id===id),st=stats(s,w),h=hoursByDay(st.ps),ds=days(w).slice(0,5),mx=Math.max(9,...Object.values(h));
 const trend=[-3,-2,-1,0].map(o=>{const k=dk(monday(new Date(w+'T00:00:00'),o));return{k,sc:stats(s,k).score}});
 const nt=data.notes.filter(x=>x.uid===id&&(x.key===w||days(w).some(d=>dk(d)===x.key))).sort((a,b)=>a.key<b.key?-1:1);
 const stars=i=>[1,2,3,4,5].map(v=>`<button class="${ev.q[i]===v?'on':'g'}" onclick="ev.q[${i}]=${v};ev.keep=1;render()">${v}</button>`).join(' ');
 if(ev.id!==id+w){ev={id:id+w,q:st.e?.q||[3,3,3],c:st.e?.comment||''}}
 return`<div class="row" style="margin-bottom:10px"><button class="g" onclick="view='team';render()">← Overview</button><h2 style="margin:0">${esc(s.name)} <span class="mu">${esc(s.dept)} · badge ${esc(s.badge||'—')}</span></h2></div>
 <div class="grid"><div class="card"><h2>Hours by day</h2><svg viewBox="0 0 300 140" width="100%">${ds.map((d,i)=>{const v=h[dk(d)]||0,bh=v/mx*100;return`<rect x="${i*60+12}" y="${110-bh}" width="36" height="${bh}" rx="5" fill="var(--ac)"/><text x="${i*60+30}" y="125" text-anchor="middle" font-size="11" fill="var(--mu)">${d.toLocaleDateString([],{weekday:'short'})}</text><text x="${i*60+30}" y="${104-bh}" text-anchor="middle" font-size="11" fill="currentColor">${v?v.toFixed(1):''}</text>`}).join('')}</svg><div>${chips(st,w)}</div><div class="mu">${st.full} of ${st.exp} days = <b>${Math.round(st.att)}%</b> · ${st.hrs.toFixed(1)} h worked</div></div>
 <div class="card"><h2>Score trend (4 weeks)</h2><svg viewBox="0 0 300 140" width="100%">${trend.map((t,i)=>`<rect x="${i*72+16}" y="${110-t.sc}" width="44" height="${t.sc}" rx="5" fill="${col(t.sc)}"/><text x="${i*72+38}" y="${104-t.sc}" text-anchor="middle" font-size="12" fill="currentColor">${Math.round(t.sc)}</text><text x="${i*72+38}" y="127" text-anchor="middle" font-size="10" fill="var(--mu)">${t.k.slice(5)}</text>`).join('')}</svg></div>
 <div class="card"><h2>Evaluation (this week)</h2><div class="mu">Quality of work</div>${stars(0)}<div class="mu" style="margin-top:8px">Productivity</div>${stars(1)}<div class="mu" style="margin-top:8px">Teamwork &amp; initiative</div>${stars(2)}<label>Comment</label><textarea id="ec">${esc(ev.c)}</textarea><br><br><button onclick="saveEval('${id}','${w}')">Save evaluation</button></div></div>
 <div class="card" style="margin-top:14px"><h2>Plans &amp; reports this week</h2>${nt.length?nt.map(n=>`<p><b>${n.kind.replace('-',' ')}</b> <span class="mu">${n.key}</span><br>${esc(n.text)||'<i class="mu">empty</i>'}</p>`).join(''):'<p class="mu">Nothing submitted.</p>'}</div>
 <div class="card wrap" style="margin-top:14px"><h2>Time log — shift ${shift().start} to ${shift().end}</h2>${timeTable(st,w)}</div>`}
async function saveEval(id,w){const q=ev.q,c=$('#ec').value;await db.collection('evals').doc(id+'_'+w).set({uid:id,week:w,q,comment:c,rating:q.reduce((a,b)=>a+b,0)/3});ev.id=null}

function device(){return`<div class="grid"><div class="card"><h2>Hikvision DS-K6B411TX-M</h2><p class="mu">The local Hikvision bridge polls the turnstile’s ISAPI access events and syncs authorized passes to this ERP. Keep the bridge running on a computer on the same network as the device. Enroll each employee’s face on the turnstile and set their <b>badge / employee No.</b> here to the same number. The bridge records punch events; face images stay on the device.</p><p class="mu">Manual event import format:<br><code>[{"employeeNo":"1001","time":"2026-10-07T08:02:11+03:00"}]</code></p></div>
 <div class="card"><h2>Import device events</h2><textarea id="imp" placeholder='[{"employeeNo":"1001","time":"..."}]'></textarea><div class="row" style="margin-top:8px"><button onclick="imp()">Import</button><span id="impr" class="mu"></span></div><p class="mu">The first valid event of the day is IN; later events update one OUT time. Events within two minutes are treated as one passage. Re-importing is safe.</p></div></div>`}
async function imp(){try{const a=JSON.parse($('#imp').value).map(e=>({s:data.staff.find(x=>x.badge&&x.badge===String(e.employeeNo)),t:new Date(e.time).getTime()})).sort((a,b)=>a.t-b.t);let n=0,m=0;const groups=new Map();
 for(const e of a){if(!e.s||isNaN(e.t)){m++;continue}const k=e.s.id+'_'+dk(new Date(e.t));if(!groups.has(k))groups.set(k,{s:e.s,day:dk(new Date(e.t)),events:[]});const g=groups.get(k);if(!g.events.some(t=>Math.abs(t-e.t)<120000))g.events.push(e.t)}
 for(const g of groups.values()){const refs=await db.collection('punches').where('uid','==',g.s.id).get();const old=refs.docs.map(d=>({id:d.id,ref:d.ref,...d.data()})).filter(p=>p.src==='device'&&dk(new Date(p.ts))===g.day).sort((x,y)=>Number(x.ts)-Number(y.ts));const times=[...old.map(p=>Number(p.ts)),...g.events].sort((x,y)=>x-y);if(!times.length)continue;const first=times[0],last=times[times.length-1],inRef=old[0]?.ref||db.collection('punches').doc(g.s.id+'_device_in_'+g.day),outRef=db.collection('punches').doc(g.s.id+'_device_out_'+g.day),b=db.batch();b.set(inRef,{uid:g.s.id,ts:first,type:'in',src:'device'});if(last>first)b.set(outRef,{uid:g.s.id,ts:last,type:'out',src:'device'});for(const p of old)if(p.id!==inRef.id&&p.id!==outRef.id)b.delete(p.ref);await b.commit();n+=g.events.length}
 $('#impr').textContent=`Imported ${n}, skipped ${m} (unknown badge or bad time).`}catch(x){$('#impr').textContent='Import failed: '+x.message}}

let authMode = 'login', initDone=false, rulesWarn=false, dataSubs=null, dataSubsUid=null;
function authModeFromHash(){
 const h=(location.hash||'').replace(/^#\/?/,'').toLowerCase();
 return h==='register'?'register':'login';
}
function setAuthMode(m){
 authMode=m==='register'?'register':'login';
 const hash='#'+authMode;
 if(location.hash!==hash)history.replaceState(null,'',hash);
 render();
}
window.addEventListener('hashchange', ()=>{ const m=authModeFromHash(); if(m!==authMode){authMode=m; render();} });
function togglePw(id){
 const el=document.getElementById(id); if(!el)return; el.type=el.type==='password'?'text':'password';
 const t=document.getElementById(id+'T'); if(t)t.textContent=el.type==='password'?'Show':'Hide';
}
function showErr(msg){
 const el=$('#app'); if(el) el.innerHTML=`<div class="card" style="max-width:560px;margin:40px auto"><h2 style="color:#b23a3a">Unable to start</h2><p class="mu">${msg}</p><button class="g" onclick="location.reload()">Retry</button></div>`;
}
function setRulesBanner(){
 if(rulesWarn)return; rulesWarn=true;
 const b=document.createElement('div'); b.id='rulesBanner'; b.style.cssText='position:sticky;top:0;background:#fff3cd;color:#856404;border-bottom:1px solid #ffeaa7;padding:8px 16px;font-size:13px;z-index:10;display:flex;align-items:center;justify-content:space-between';
 b.innerHTML='<span>⚠ Firestore permissions denied. Open Firebase Console → Firestore Database → Rules and publish read/write rules (or temporary open rules for testing).</span><button class="g" style="padding:2px 10px;font-size:12px" onclick="document.getElementById(\'rulesBanner\')&&document.getElementById(\'rulesBanner\').remove()">Dismiss</button>';
 document.body.insertBefore(b, document.body.firstChild);
}
function clearRulesBanner(){ rulesWarn=false; const b=document.getElementById('rulesBanner'); if(b)b.remove(); }
function detachDataSubs(){
 if(dataSubs){ dataSubs.forEach(u=>{try{u()}catch(e){}}); dataSubs=null; }
 dataSubsUid=null;
}
function attachDataSubs(userUid){
 if(dataSubsUid===userUid)return;
 detachDataSubs();
 dataSubsUid=userUid;
 dataSubs=['staff','punches','notes','evals','settings'].map(n=>db.collection(n).onSnapshot(
   s=>{data[n]=s.docs.map(d=>({id:d.id,...d.data()}));render()},
   err=>{
     if(err && (err.code==='permission-denied'||err.code==='unauthenticated') && !!uid) setRulesBanner();
     console.warn('snapshot', n, err);
   }
 ));
}
async function init(){
 authMode = authModeFromHash();
 const t=setTimeout(()=>{if(!initDone)showErr('Initialization timed out. Check your network connection and Firebase CDN access (gstatic.com).')},10000);
 try{
  db=await claude.use('db'); auth=await claude.use('auth');
  if(!db||!auth){clearTimeout(t);showErr('Firebase services unavailable. Ensure firebase-app-compat, firestore-compat, and auth-compat scripts are loaded from gstatic.com.');return;}
  initDone=true; clearTimeout(t);
  auth.onAuthStateChanged(async user => {
    uid = user ? user.uid : null;
    if(!uid){ clearRulesBanner(); detachDataSubs(); }
    else{ attachDataSubs(uid); }
    await render();
  });
  setInterval(()=>{const c=$('#clk');if(c)c.textContent=new Date().toLocaleTimeString()},1000);
 }catch(err){clearTimeout(t);showErr(err.message||String(err));}
}

async function render(){
 if(!db)return;
 const w=wkey();$('#wl').textContent='Week of '+w;
 if(!uid) {
   $('#role').textContent=''; $('#nav').innerHTML='';
   const lOut = $('#logoutBtn'); if(lOut) lOut.style.display='none';
   const topRow = $('#topRow'); if(topRow) topRow.style.display='none';
   const form = authMode==='login'
    ? `<form onsubmit="event.preventDefault();login()" autocomplete="on">
        <div class="authField"><label for="le">Work email</label><input autocomplete="username" name="username" id="le" type="email" placeholder="name@iracktech.com" required></div>
        <div class="authField"><label for="lp">Password</label><input autocomplete="current-password" name="password" id="lp" type="password" placeholder="Enter your password" required><button type="button" class="pwToggle" id="lpT" onclick="togglePw('lp')">Show</button></div>
        <div class="authForgot"><button type="button" class="link" id="frBtn" onclick="resetPassword()">Forgot password?</button></div>
        <button type="submit" class="authBtn" id="liBtn">Sign In</button>
       </form>`
    : `<form onsubmit="event.preventDefault();registerUser()" autocomplete="on">
        <div class="authField"><label for="rn">Full name</label><input autocomplete="name" name="name" id="rn" type="text" placeholder="e.g. Kidus Adugna" autocapitalize="words" required></div>
        <div class="authField"><label for="re">Work email (@iracktech.com)</label><input autocomplete="email" name="email" id="re" type="email" placeholder="name@iracktech.com" required></div>
        <div class="authField"><label for="rp">Create a password</label><input autocomplete="new-password" name="new-password" id="rp" type="password" placeholder="At least 6 characters" minlength="6" required><button type="button" class="pwToggle" id="rpT" onclick="togglePw('rp')">Show</button></div>
        <button type="submit" class="authBtn" id="rgBtn">Create account</button>
       </form>`;
   const sub = authMode==='login'
    ? `<div class="authSubRow"><span>No account?</span><button class="link" onclick="setAuthMode('register')">Create account</button></div>`
    : `<div class="authSubRow"><span>Already have an account?</span><button class="link" onclick="setAuthMode('login')">Sign in</button></div>`;
   $('#app').innerHTML = authShell(form, sub);
   if (location.hash !== '#'+authMode) history.replaceState(null,'','#'+authMode);
   return;
 }
 document.body.classList.remove('authView');
 const topRow = $('#topRow'); if(topRow) topRow.style.display='';

 const managerEmail = 'manager@iracktech.com';
 const userEmail = (auth.currentUser?.email || '').toLowerCase();
 mgr = userEmail === managerEmail;
 let my = data.staff.find(x=>x.id===uid);
 if(!my){
   if(uid){
     try {
       const snap = await db.collection('staff').doc(uid).get();
       if(snap?.exists){
         my = {id:snap.id,...snap.data()};
         if(!data.staff.some(s=>s.id===uid)) data.staff.push(my);
       } else {
         await db.collection('staff').doc(uid).set({
           name: auth.currentUser?.displayName || userEmail.split('@')[0],
           email: userEmail,
           dept: mgr ? 'Management' : 'Employee',
           badge:'', days:5, active:true, mgr:mgr
         },{merge:true});
         my = {id:uid,name:auth.currentUser?.displayName||userEmail.split('@')[0],email:userEmail,dept:mgr?'Management':'Employee',active:true,mgr:mgr};
       }
     } catch(e){}
   }
 }
 if(!my){
   $('#app').innerHTML = `<div class="card" style="max-width:480px;margin:40px auto"><p class="mu">Loading user profile…</p></div>`;
   return;
 }
 myEmail=my.email; myName=my.name;
 if(!mgr && !my.mgr){
   try{await db.collection('staff').doc(uid).set({mgr:false},{merge:true});}catch(e){}
 }
 if(mgr){
   try{await db.collection('staff').doc(uid).set({mgr:true, dept:'Management'},{merge:true});}catch(e){}
 }
 const roleEl=$('#role'); roleEl.textContent=mgr?'Manager':''; roleEl.style.display=roleEl.textContent?'':'none';
 const lOut = $('#logoutBtn'); if(lOut) lOut.style.display='block';
 if(!mgr) asEmp=false;

 if(document.activeElement?.id==='fq'){ if(mgr)dash(); return;}
 if(document.activeElement?.id==='pq'){ if(mgr)plist(); return;}
 if(document.activeElement&&/TEXTAREA|INPUT/.test(document.activeElement.tagName))return;

 $('#nav').innerHTML=mgr?`
  <button class="${asEmp?'g':'on'}" onclick="asEmp=false;render()">Manager dashboard</button>
  <button class="${asEmp?'on':'g'}" onclick="asEmp=true;render()">Employee preview</button>`:'';
 if(mgr){
  $('#app').innerHTML=asEmp?employee(w):manager(w);
 } else {
  if(typeof sel==='string')sel=null;
  $('#app').innerHTML=employee(w);
 }
}

function setBusy(id, busy){
 const b=document.getElementById(id); if(!b)return; if(busy){b.disabled=true; b.dataset.old=b.textContent; b.textContent=busy;}
 else{b.disabled=false; if(b.dataset.old){b.textContent=b.dataset.old; delete b.dataset.old;}}
}

function authErrorMessage(err, action){
 const code=err?.code||'';
 if(action==='reset'){
  if(code==='auth/invalid-email'||code==='auth/missing-email')return 'Enter a valid work email address, then try again.';
  if(code==='auth/too-many-requests')return 'There have been too many requests. Wait a few minutes, then try again.';
  if(code==='auth/network-request-failed')return 'We couldn’t reach the sign-in service. Check your internet connection and try again.';
  if(code==='auth/operation-not-allowed'||code==='auth/configuration-not-found')return 'Password reset isn’t available right now. Please contact your administrator.';
  return 'If an account exists for that email, we sent a password reset link. Check your inbox and spam folder.';
 }
 const messages={
  'auth/invalid-login-credentials':"We couldn't sign you in with those details. Check your email and password, then try again. If you haven't created an account, choose Create account.",
  'auth/invalid-credential':"We couldn't sign you in with those details. Check your email and password, then try again. If you haven't created an account, choose Create account.",
  'auth/user-not-found':"We couldn't find an account with those details. Check your email, or choose Create account to get started.",
  'auth/wrong-password':"That password doesn't match this account. Check it and try again.",
  'auth/invalid-email':'Enter a valid email address and try again.',
  'auth/missing-email':'Enter your email address to continue.',
  'auth/missing-password':'Enter your password to continue.',
  'auth/weak-password':'Choose a stronger password with at least 6 characters.',
  'auth/email-already-in-use':'An account with this email already exists. Try signing in instead.',
  'auth/too-many-requests':'There have been too many attempts. Wait a few minutes, then try again.',
  'auth/network-request-failed':'We couldn’t reach the sign-in service. Check your internet connection and try again.',
  'auth/user-disabled':'This account is currently disabled. Please contact your administrator.',
  'auth/operation-not-allowed':'Email and password sign-in isn’t enabled yet. Please contact your administrator.',
  'auth/configuration-not-found':'Sign-in isn’t available right now. Please contact your administrator.'
 };
 return messages[code] || (action==='register'
  ? 'We couldn’t create your account just now. Please try again. If the problem continues, contact your administrator.'
  : 'We couldn’t sign you in just now. Please try again. If the problem continues, contact your administrator.');
}

function showAuthMessage(message){
 const el=$('#am');
 if(el)el.textContent=message||'';
}

async function login(){
 const e=$('#le').value.trim().toLowerCase(), p=$('#lp').value;
 showAuthMessage('');
 if(!e||!p){showAuthMessage(!e?'Enter your email address to continue.':'Enter your password to continue.');return;}
 setBusy('liBtn','Signing in…');
 try {
   await auth.signInWithEmailAndPassword(e, p);
 } catch(err) {
   showAuthMessage(authErrorMessage(err,'login'));
 } finally { setBusy('liBtn', false); }
}

async function resetPassword(){
 const e=$('#le').value.trim().toLowerCase();
 showAuthMessage('');
 if(!okMail(e)){showAuthMessage('Enter your work email ending in @iracktech.com above, then choose Forgot password again.');$('#le').focus();return;}
 setBusy('frBtn','Sending…');
 try{
  await auth.sendPasswordResetEmail(e);
  showAuthMessage('If an account exists for that email, we sent a password reset link. Check your inbox and spam folder.');
 }catch(err){
  showAuthMessage(authErrorMessage(err,'reset'));
 }finally{setBusy('frBtn',false);}
}

async function registerUser(){
 const n=$('#rn').value.trim().replace(/\s+/g,' '), e=$('#re').value.trim().toLowerCase(), p=$('#rp').value;
 showAuthMessage('');
 if(!n){showAuthMessage('Enter your full name in the Full name field.');$('#rn').focus();return;}
 if(!okMail(e)){showAuthMessage('Enter your work email ending in @iracktech.com in the Work email field.');$('#re').focus();return;}
 if(p.length<6){showAuthMessage('Choose a password with at least 6 characters.');$('#rp').focus();return;}
 if(data.staff.some(x=>x.email===e)){showAuthMessage('An account with this email already exists. Try signing in instead.');return;}
 setBusy('rgBtn','Creating account…');
 try {
